# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuring-dependabot-version-updates

version: 2
updates:
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: "weekly"
- package-ecosystem: pip
  directory: "/"
  schedule:
    interval: "weekly"
  ignore:
    # Home Assistant core pins getmac; hassfest rejects a manifest requirement
    # that differs from that pin, so the version follows HA, not upstream (#839).
    - dependency-name: "getmac"
