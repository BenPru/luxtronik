name: Luxtronik Integration Tests

on:
  push:
    branches: [main]
    paths:
      - 'custom_components/luxtronik2/**'
      - 'tests/**'
  pull_request:
    branches: [main]
    paths:
      - 'custom_components/luxtronik2/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 only: Home Assistant requires Python >=3.14.2 from 2026.7 onwards,
        # so a 3.13 job resolves back to HA 2026.2 - below the 2026.9 minimum this
        # integration declares in hacs.json, and a combination no user can run.
        python-version: ["3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest --cov=custom_components.luxtronik2 --cov-report=xml --cov-report=term-missing tests/

      - name: Upload coverage report
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
